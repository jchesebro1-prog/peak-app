<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Peak Estimator — prototype (Confidential)</title>
    <!-- Optional: without the network the UI falls back to the family names below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app/app.css" />
    <!-- The app's font and accent variables (Quartzite sets them on <html> from next/font and Settings → Branding).
         A :root rule, not an <html style> attribute, so a host that rewrites <html> keeps them. -->
    <style>
      :root {
        --accent: #b08d4a;
        --accent-contrast: #16181b;
        --font-public-sans: "Public Sans";
        --font-plex-mono: "IBM Plex Mono";
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Confidential — Peak Systems Group. This prototype needs JavaScript.</noscript>
    <!-- @HANDOFF_DATA_SCRIPTS -->
    <script src="./app/app.js"></script>
  </body>
</html>
