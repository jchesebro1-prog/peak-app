<!--
  Peak Design — a single-file, offline program for laying out a venue's equipment.
  Spun out of the Quartzite app's Design tab (Quick Design + a core of "The Grid") on 2026-11-19.
  No server, no login, no network, no libraries. Data lives in this browser (IndexedDB, with a
  localStorage fallback) plus backup files you export from the Backup tab.
  Spec: docs/handoff/design-spec.md (chapters 2-7).  Built-in data: docs/handoff/design-data.json
  (embedded below as DATA, unchanged).  Sibling program: docs/handoff/programs/peak-service.html.

  What it does
    Designs ........ intake (venue, size, dimensions, tier, systems, Auto or Blank), ids D-###
    Plan ........... a to-scale venue plan stretched from the venue template; place, move, select,
                     delete devices; designators; layers; undo / redo; pan and zoom
    Estimate ....... the Quick Design equations, priced only through the Equipment map
    BOM ............ what is placed on the plan, grouped by heading, with labor
    Auto fill ...... lays the equation quantities out on the plan by rule
    Documents ...... Plan sheet (11x17 or 24x36 landscape) and Device schedule + BOM; BOM as CSV
    Equipment map, Parts, Settings, How it works, Backup

  Ported from (repo-relative):
    equations ...... src/app/(app)/design/quick/engine.ts, src/lib/design/goods.ts,
                     src/lib/design/venue-dims.ts, src/lib/design/cable-package.ts,
                     src/lib/design/wire-labor.ts
    pricing ........ src/lib/design/equipment-pricing.ts, src/lib/design/equipment-map.ts,
                     src/lib/design/equipment-map-view.ts, src/lib/design/curtain-pricing.ts,
                     src/lib/stores/equipment-map.ts, src/lib/stores/design-pricing.ts,
                     src/lib/stores/pricing.ts, src/lib/markup/index.ts
    vocabulary ..... src/lib/design/equipment-vocab.ts
    venues ......... src/lib/design/venue-templates/*.json, *.keys.ts, stretch.ts, templates.ts,
                     house-dims.ts, index.ts, canvas.ts; src/app/(app)/design/quick/plan-svg.tsx;
                     src/lib/venue-types.ts; src/lib/design/grid-intake.ts
    records ........ src/lib/stores/designs.ts, src/lib/stores/grid-projects.ts
    scopes, BOM .... src/lib/design/grid-scopes.ts, grid-bom.ts, grid-bom-groups.ts, grid-icons.ts
    device types ... src/lib/design/device-types.ts, grid-symbols.ts, grid-symbol-display.ts
    designators .... src/lib/design/designators.ts, src/lib/settings.ts
    Auto fill ...... src/lib/design/grid-auto-layout.ts, grid-auto-fill.ts, grid-auto-model.ts,
                     auto-estimate.ts
    workspace ...... src/lib/design/grid-undo.ts, grid-selection.ts, grid-tools.ts, grid-geometry.ts
    drawing set .... src/lib/design/grid-drawing-set.ts (sheet sizes and title block only)
    wire types ..... src/lib/catalog-connect.ts, src/lib/design/wire-starter.ts (list only)

  NOT in this program (see "How it works" > "Not in this program"):
    plan-sheet PDF / image upload and calibration; the Spaces / room polygon editor and the room
    shape editor; movable rooms; wire routing; risers and conduit fill; the multi-sheet drawing
    set; revisions and options; the Specs module; Consulting; promote-to-quote; object symbols;
    assemblies and racks; the shared catalog (Parts here is a small local list); the Church
    Contemporary background (its outlines are in DATA but it is not drawn).

  Simplified against the app (each is also commented where it happens):
    - Template stretch: rebuilt from the outlines and the stretch notes in DATA, not the app's
      full line work. Gym Stage, Black Box / Conference and Arena are redrawn by rule from the
      template's fixed sizes; Auditorium / PAC and Church stretch the template outlines.
    - Auto fill uses the spec's placement formulas; "fractions of the sheet" are converted to
      feet on a sheet built from the plan's size and the app's canvas margins.
    - Positions are stored in feet from the plan's fixed point, not as fractions of a sheet.
-->

    ${list.map(p => `<tr data-part="${h(p.id)}"><td style="min-width:130px">${inp(p, "sku")}</td><td style="min-width:110px">${inp(p, "manufacturer")}</td><td style="min-width:110px">${inp(p, "model")}</td><td style="min-width:180px">${inp(p, "description")}</td><td>${sel(p, "deviceType", [["", "—"]].concat(DTYPES.map(t => [t.key, t.label])), { style: "max-width:150px" })}</td><td>${sel(p, "scope", [["", p.deviceType && DT[p.deviceType] ? "From type (" + (DT[p.deviceType].scope === "Unscoped" ? "General" : DT[p.deviceType].scope) + ")" : "—"]].concat(LAYERS.map(l => [l.key, l.key === "Unscoped" ? "General" : l.key])))}</td><td>${sel(p, "unit", UNITS)}</td><td class="num">${inp(p, "cost", { num: true, min: 0, step: "any", blank: 0 })}</td><td class="num">${inp(p, "markup", { num: true, min: 0, step: "any", blank: null, cls: "q", ph: String(S.settings.markup) })}</td><td class="num" style="white-space:nowrap">${$c(partSell(p))}</td><td><button class="s d" ${act(() => { if (!used(p.id) || confirm("This part is used on the Equipment map or on a plan. Delete it anyway? Anything using it will read “needs a part”.")) { S.parts = S.parts.filter(x => x !== p); save(); render(); } })}>Delete</button></td></tr>`).join("")}</table>` : `<p class="mut">${S.parts.length ? "No parts match that search." : "No parts yet. Add one, or paste a list below."}</p>`}</div>
  <div class="card"><h2>Paste a list (CSV)</h2><p class="mut">First row is the headings: <code>sku, manufacturer, model, description, deviceType, cost</code>. Optional extra columns: <code>scope</code>, <code>unit</code> (ea, ft, sqft, lot), <code>markup</code>. A row whose SKU is already in the list updates that part. Copying cells straight out of a spreadsheet works too.</p>
    ${ta(UI, "csv", 6, { id: "csvBox", ph: "sku,manufacturer,model,description,deviceType,cost\nABC-100,Acme,Model 100,LED par,Fixtures,450" })}<div class="bar" style="margin:8px 0 0"><button class="p" id="csvImport" ${act(() => { const el = document.getElementById("csvBox"); UI.csv = el.value; UI.msg = importParts(UI.csv); if (/added/.test(UI.msg)) UI.csv = ""; save(); render(); })}>Import</button><span id="csvMsg">${h(UI.msg)}</span></div></div>`;
}

/* ---------- Settings ---------- */
function vSettings() {
  const st = S.settings, row = (label, hint, html) => `<div class="pl"><span>${label}<br><small>${hint}</small></span><span>${html}</span></div>`;
  const setCode = (t, v) => { v = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); if (!v || v === t.code) { delete S.typeCodes[t.key]; return; } if (DTYPES.some(o => o.key !== t.key && typeCode(o.key) === v)) { alert("Another device type already uses " + v + "."); delete S.typeCodes[t.key]; return; } S.typeCodes[t.key] = v; };
  return `<h1>Settings</h1><p class="sub">These apply to every design straight away.</p>
  <div class="row"><div class="card grow"><h2>Pricing rules</h2>
    ${row("Default markup", "% on cost: a part or allowance sells at cost × (1 + markup)", inp(st, "markup", { num: true, min: 0, max: 1800, step: "any", blank: 43 }))}
    ${row("Labor", "% of each system's priced equipment (0–60)", inp(st, "laborPct", { num: true, min: 0, max: 60, step: "any", blank: 18 }))}
    ${row("Freight", "% of equipment (0–20)", inp(st, "freightPct", { num: true, min: 0, max: 20, step: "0.5", blank: 5 }))}
    ${row("Contingency", "% of equipment + labor + freight (0–25, whole number)", inp(st, "contingencyPct", { num: true, min: 0, max: 25, step: "1", blank: 10 }))}
    ${row("Curtain sewing", "% added to the fabric cost of every curtain (0–100)", inp(st, "sewingPct", { num: true, min: 0, max: 100, step: "any", blank: 10 }))}
    ${row("Cable Package per fixture", "packages per lighting fixture (0–10)", inp(st, "perFixture", { num: true, min: 0, max: 10, step: "any", blank: 1 }))}</div>
  <div class="card grow"><h2>Tier multipliers</h2><p class="mut">Applied to labor, the Cable Package and wire pull (0–3). A tier otherwise changes price only through which part you map to it.</p>
    ${TIERS.map(t => row(h(t.label), h(t.blurb), inp(st.tierMult, t.key, { num: true, min: 0, max: 3, step: "any", blank: DATA.tiers.tierMultipliersDefault[t.key] }))).join("")}
    <h3>Wire pull — runs per system</h3><p class="mut">Feet = (stage width + stage depth) × runs × tier multiplier. 0 leaves the line off.</p>${WIRE_SYSTEMS.map(s => row(h(SYS[s].equipmentMapLabel), "runs (0–20)", inp(st.runs, s, { num: true, min: 0, max: 20, step: "1", blank: 0 }))).join("")}</div></div>
  <div class="row"><div class="card grow"><h2>Company (printed in the title block)</h2><div class="grid2">${fld("Company name", inp(S.company, "name"))}${fld("Address", inp(S.company, "address"))}${fld("Phone", inp(S.company, "phone"))}${fld("Drawn by", inp(S.company, "drawnBy"))}</div></div>
  <div class="card grow"><h2>Drawings</h2>${row("Plan sheet size", "landscape", sel(st, "sheet", Object.values(DATA.sheetSizes.sizes).map(z => [z.key, z.label])))}${row("Designator digits", "2 prints LX-01; 1 prints LX-1", sel(st, "pad", [[2, "2 digits"], [1, "1 digit"]], { after: v => { st.pad = Number(v); } }))}</div></div>
  <div class="card"><h2>Device types and designator codes</h2><p class="mut">Each placed device is numbered with its type's code. A code is 1–6 letters or digits and must be unique. Devices already on a plan keep their designator until you use Renumber in that design.</p>
    <table><tr><th>Device type</th><th>Layer</th><th>Code</th><th>Built-in</th></tr>${DTYPES.map(t => { const tmp = { c: typeCode(t.key) }; return `<tr><td>${h(t.label)}</td><td><span class="dot" style="background:${LAYER[t.scope].color}"></span>${h(t.scope === "Unscoped" ? "General" : t.scope)}</td><td>${inp(tmp, "c", { cls: "n", rr: true, after: v => setCode(t, v) })}</td><td class="mut">${h(t.code)}</td></tr>`; }).join("")}</table></div>
  <div class="card"><h2>Wire types</h2><p class="mut">A reference list of cable families and the connections each carries. This program does not draw wires; the list is kept so it travels with your backup.</p>
    <table><tr><th>Name</th><th>Carries</th><th></th></tr>${S.wireTypes.map(w => { const tmp = { c: (w.connectionTypes || []).join(", ") }; return `<tr><td style="min-width:220px">${inp(w, "label")}</td><td>${inp(tmp, "c", { after: v => { w.connectionTypes = String(v).split(",").map(x => x.trim()).filter(Boolean); } })}</td><td><button class="s d" ${act(() => { S.wireTypes = S.wireTypes.filter(x => x !== w); save(); render(); })}>Remove</button></td></tr>`; }).join("")}</table>
    <div class="bar" style="margin:8px 0 0"><button class="s" ${act(() => { S.wireTypes.push({ id: "wt-" + Date.now().toString(36), label: "New wire type", connectionTypes: [] }); save(); render(); })}>+ Add wire type</button><button class="s" ${act(() => { if (confirm("Put the wire type list back to the built-in " + DATA.wireTypes.defaults.length + "?")) { S.wireTypes = JSON.parse(JSON.stringify(DATA.wireTypes.defaults)); save(); render(); } })}>Reset to built-in list</button></div></div>`;
}

/* ---------- How it works ---------- */
/** The spec's worked example, run through this program's own engine and set beside the handoff data's expected numbers. */
function workedExample() {
  const X = DATA.equations.workedExample, d = blankDraft(); Object.assign(d, X.input, { sys: {}, qtyOv: { good: {}, better: {}, best: {} }, dial: {}, houseWidthFt: null });
  SYSTEMS.forEach(s => { d.sys[s.key] = true; const so = s.subOptions; if (so && so.mode === "multi") { d[so.stateKey] = {}; so.options.forEach(o => d[so.stateKey][o.key] = true); } });
  /* The example's item list has no Scenery track line, so it is run with Scenery off (the app's default). */
  d.drape.scenerytrack = false; d.rigType = X.input.rigType; d.pitType = X.input.pitType;
  const e = estimate(d, X.input.tier), mine = {}; e.lines.forEach(l => mine[l.key] = l);
  const keys = X.items.map(i => i.key); e.lines.forEach(l => { if (!keys.includes(l.key)) keys.push(l.key); });
  const rows = keys.map(k => { const x = X.items.find(i => i.key === k), m = mine[k]; return { key: k, label: VR[k].label, system: SYS[VR[k].system].equipmentMapLabel, unit: VR[k].unit, expected: x ? x.qty : null, mine: m ? m.qty : null, drapeOk: !x || !x.drape || (m && m.drape && m.drape.w === x.drape.w && m.drape.h === x.drape.h && m.drape.f === x.drape.fullness && m.drape.panels === x.drape.qty) }; });
  const stats = [["Line sets (statistic)", X.lineSets, e.c.stats.lineSets], ["Electrics", X.electrics, e.c.electrics], ["Dimmer racks", X.dimmerRacks, e.c.stats.dimmerRacks], ["Rigging set count", X.rigSets, e.c.rigSets]];
  return { input: X.input, rows, stats, ok: rows.every(r => r.expected === r.mine && r.drapeOk) && stats.every(s => s[1] === s[2]) };
}
function vRules() {
  const st = S.settings, Q = DATA.equations, W = workedExample(), HN = { "pick(a,b,c)": "Size pick", dBlk: "Depth blocks", sets: "Sets", rigSets: "Rigging set count", pipeLenFt: "Pipe length", electrics: "Electrics", E: "E", wUnit: "Width units", lineSets: "Line sets (shown only)", drapeArea: "Opening area (shown only)", dimmerRacks: "Dimmer racks (shown only)", rounding: "Rounding" };
  const place = { each: "one marker per unit", lot: "one marker carrying the quantity", curtain: "a curtain drawn to its width", none: "not drawn on the plan" };
  const fills = [["Par, Automated", "In rows across the stage on the electrics. With E electrics, the j-th (from 0) sits (E − j) ÷ (E + 1) of the way down the stage."], ["Front", "Along the catwalk, from 6 % to 94 % of its width. With no catwalk: two rows across the audience at 45 % and 60 % of its depth."], ["Cyc", "One row across the stage, 5 % of its depth from the back wall."], ["Side light", "Alternating left and right of the stage, just outside its side walls (inside them in a church)."], ["Line-array loudspeaker", "Alternating left and right of the stage, stacked two to a row just in front of it."], ["Subwoofer", "Evenly along the curved stage edge; with no curve, in a row along the front of the stage."], ["Mixer / DSP, Video processor, Projector", "In a row across the booth (the mix position in a church)."], ["Screen", "Between 30 % and 70 % of the stage's width, 10 % of its depth from the back wall."], ["Hoists, Rigging points, Headblocks", "In rows across the stage on the set lines."], ["Curtains", "On the stage's centre line (Legs at its left edge), at set depths from the back wall: Draw 95 %, 50 %, 26 %; Full stage 50 %, 30 %; Border and Legs 74 %, 48 %, 22 %."], ["Any other single item", "In a row along the front of the stage (the audience, for an Audio item)."], ["Items carried as one marker", "Rigging: beside the stage at the lock rail. Everything else: along the front of its area."]];
  return `<h1>How it works</h1><p class="sub">Every number this program shows comes from the rules on this page. The live values are your current Settings.</p>
  <div class="card"><h2>1. A design</h2><p>A design is one venue. You pick the <b>venue</b> (${VENUES.map(v => h(v.label)).join(", ")}), a <b>size</b> (Small, Medium or Large), type its <b>dimensions</b>, choose a <b>tier</b> (${TIERS.map(t => h(t.label)).join(", ")}) and switch the <b>systems</b> on or off. Picking a venue or a size fills in typical dimensions — the venue's base size × ${Object.entries(DATA.venueKinds.sizePresets.multipliers).map(e => e[1] + " (" + e[0] + ")").join(", ")} — and you may type over them. Limits: ${Object.entries(DIM_LIM).map(e => ({ width: "width", depth: "depth", grid: "grid height", wing: "wing", ph: "proscenium height" }[e[0]]) + " " + e[1][0] + "–" + e[1][1] + " ft").join("; ")}. The size also feeds the equations on its own, whatever dimensions you type.</p>
    <p>Designs are numbered D-101, D-102… An <b>Auto</b> design lays the equipment out on the plan for you; a <b>Blank</b> design never does.</p></div>
  <div class="card"><h2>2. The plan</h2><p>The plan is drawn to scale from a built-in drawing of each kind of venue, stretched to your dimensions:</p><ul>${[...new Set(VENUES.map(v => v.template))].map(t => { const s = TPL[t].stretch; return `<li><b>${h(VENUES.filter(v => v.template === t).map(v => v.label).join(" and "))}.</b> ${h(s.sideToSide)} ${h(s.frontToBack)}</li>`; }).join("")}</ul>
    <p class="mut">This program follows those rules from the outlines of the named areas; it does not carry the full drawing, so fine detail (doors, seats, wall thickness) is not shown. Rooms that can be moved in the original stay at their home position.</p></div>
  <div class="card"><h2>3. The estimate equations</h2><p>The equations give <b>quantities only</b>. W is the width, D the depth, G the grid or ceiling height, PH the proscenium height. Three numbers written a / b / c are for Small / Medium / Large.</p>
    <table><tr><th>Term</th><th>Rule</th></tr>${Object.keys(Q.helpers).map(k => `<tr><td style="white-space:nowrap"><b>${h(HN[k] || k)}</b><br><code>${h(k)}</code></td><td>${h(Q.helpers[k])}</td></tr>`).join("")}</table>
    ${SYSTEMS.map(s => `<h3 style="color:${s.quickDesignColor}">${h(s.equipmentMapLabel)}${s.subOptions ? ` <span class="mut" style="text-transform:none;letter-spacing:0">— choose ${s.subOptions.mode === "single" ? "one of" : "any of"}: ${s.subOptions.options.map(o => h(o.label)).join(", ")}</span>` : ""}</h3><table><tr><th style="width:26%">Item</th><th style="width:8%">Unit</th><th>Quantity</th><th style="width:22%">On the plan</th></tr>${VOCAB.filter(r => r.system === s.key).map(r => `<tr><td>${h(r.label)}</td><td>${UNIT_LABEL[r.unit]}</td><td>${h((Q.quantityRules.find(x => x.key === r.key) || {}).rule || r.defaultQuantityRule)}</td><td class="mut">${place[r.autoPlace]}</td></tr>`).join("")}</table>`).join("")}
    <p>An item whose quantity works out to 0 is left off. Each curtain also has a finished size: Draw and Full stage are 2 panels, each W ÷ 2 + 2 wide × PH + 1 high; Legs are 2 panels, each 6 wide × PH + 1 high; a Border is 1 panel, W wide × 5 high; all at 50 % fullness.</p>
    <p><b>Line sets.</b> On the Systems tab you can type a line-set count for a tier. Every rigging quantity is then multiplied by your count ÷ the rigging set count and rounded.</p>
    <p><b>Cable Package</b> = fixtures × ${nf(st.perFixture)} per fixture × the tier multiplier, rounded up. Fixtures are the Par, Front, Cyc, Side light and Automated quantities as you have them (a quantity you typed wins).</p>
    <p><b>Wire pull</b> = (stage width + stage depth) × runs × the tier multiplier, rounded up, one line per system. Runs now: ${WIRE_SYSTEMS.map(s => h(SYS[s].equipmentMapLabel) + " " + nf(st.runs[s])).join(", ")}. House depth is not counted. 0 runs leaves the line off.</p>
    <p><b>Your own quantities.</b> On the Quantities tab a whole number you type replaces the calculated quantity for that tier. It changes the quantity, never the unit price.</p></div>
  <div class="card"><h2>4. Tiers</h2><p>${TIERS.map(t => `<b>${h(t.label)}</b> — ${h(t.blurb)}`).join(". ")}.</p><p>A tier changes the price in only three ways: which part you map to it on the Equipment map; the line-set count you type for it; and its multiplier on labor, the Cable Package and wire pull — now ${TIERS.map(t => h(t.label) + " × " + nf(st.tierMult[t.key])).join(", ")}.</p></div>
  <div class="card"><h2>5. Pricing</h2><p>There are no built-in prices. Each item is priced from the <a href="#/map">Equipment map</a>, tier by tier:</p>
    <table><tr><th>The map says</th><th>Cost</th><th>Selling price</th></tr><tr><td>A part</td><td>the part's cost</td><td>cost × (1 + the part's markup; ${nf(st.markup)}% when blank)</td></tr><tr><td>An allowance (ticked “I confirm”)</td><td>the amount</td><td>amount × (1 + ${nf(st.markup)}%)</td></tr><tr><td>Not included</td><td>$0</td><td>$0 — a settled answer, never “Incomplete”</td></tr><tr><td>Nothing yet</td><td>—</td><td>no price: “needs a part”</td></tr></table>
    <p><b>Curtains</b> are priced by size from a fabric part priced per square foot: finished width × (1 + fullness) × finished height × the fabric's $ per sq ft × (1 + ${nf(st.sewingPct)}% sewing) × panels, rounded to the dollar; the selling price adds ${nf(st.markup)}%. An allowance on a curtain item is already the cost of one curtain.</p>
    <p><b>Totals.</b> Equipment = the sum of quantity × selling price. Labor = each system's equipment × ${nf(st.laborPct)}% × the tier multiplier, rounded once. Freight = ${nf(st.freightPct)}% of equipment. Contingency = ${nf(st.contingencyPct)}% of equipment + labor + freight. Estimate = all four.</p></div>
  <div class="card"><h2>6. “Incomplete”</h2><p>If any item with a quantity above 0, on a system that is switched on, has no price, the program shows <b>“${h(incompleteText(3))}”</b> in place of a dollar total and lists the items. It never fills the gap with a guess. An item marked “Not included” is settled and does not count. The same rule applies to the BOM of what is placed: a placed device with no part or no price makes the BOM incomplete.</p></div>
  <div class="card"><h2>7. Devices on the plan</h2><p>Every placed device is on one <b>layer</b>: ${LAYERS.map(L => `<span class="dot" style="background:${L.color}"></span>${h(L.key === "Unscoped" ? "General" : L.key)}`).join(" · ")}. One marker can stand for a quantity (a lot of up to ${LOT_MAX.toLocaleString("en-US")}). Positions are kept in feet, so a device stays put when you zoom or change the room.</p>
    <p><b>Designators.</b> Each device gets its device type's code and a number, for example ${h(typeCode("microphones"))}-${padN(1)}. Numbers run per code within a design; a new device takes the lowest free number; a lot of 24 takes 24 numbers in a row and shows the range (${h(typeCode("fixtures"))}-${padN(1)}–24). Deleting a device leaves a gap until you press Renumber, which re-issues every number top to bottom, left to right. You may type your own: anything that is not “code-number” is kept exactly as typed and is never renumbered. Two devices with the same designator are drawn in amber, not blocked. Curtains have a name, not a designator.</p>
    <table><tr><th>Layer</th><th>Device types and codes</th></tr>${LAYERS.map(L => { const ts = DTYPES.filter(t => t.scope === L.key); return ts.length ? `<tr><td style="white-space:nowrap"><span class="dot" style="background:${L.color}"></span>${h(L.key === "Unscoped" ? "General" : L.key)}</td><td>${ts.map(t => h(t.label) + " <code>" + h(typeCode(t.key)) + "</code>").join(" · ")}</td></tr>` : ""; }).join("")}</table>
    <p><b>Undo</b> remembers the last ${UNDO_DEPTH} changes to the plan while the page is open.</p></div>
  <div class="card"><h2>8. Auto fill</h2><p>In an Auto design the equation quantities for Rigging, Curtains, Lighting, Audio and Video are placed on the plan when the design is created, and again when you press Re-fill. Controls, the acoustical shell and the pit filler are priced but never drawn. A re-fill replaces only the Auto devices you have not touched; a device you moved or edited is kept and still counts toward its item, so only the difference is placed. An item that needs a part is reported and not placed; “Not included” places nothing. An item with more than ${EACH_CAP} units becomes one marker carrying the quantity.</p>
    <table><tr><th style="width:30%">Item</th><th>Where it goes</th></tr>${fills.map(f => `<tr><td>${h(f[0])}</td><td>${h(f[1])}</td></tr>`).join("")}</table>
    <p class="mut">“The stage” is the opening's width by the stage depth in an Auditorium, PAC or Gym Stage; the platform in a church or conference room; the room, set in from its walls, in a black box; the end stage in an arena.</p></div>
  <div class="card"><h2>9. The BOM</h2><p>The BOM lists what is <b>on the plan</b>: one line per part with the units placed, one line per curtain, grouped under ${HEADINGS.filter(H => H.key !== "conduit").map(H => h(H.label)).join(", ")}. Devices of the types ${CONTROLS_TYPES.map(k => h(DT[k].label)).join(", ")} print under Controls. Each heading adds a labor line: its priced equipment × ${nf(st.laborPct)}% × the tier multiplier. The Estimate tab, by contrast, lists what the equations call for whether or not it is drawn.</p></div>
  <div class="card"><h2>10. Worked example</h2><p>${h(VK[W.input.venue].label)}, ${h(W.input.size)}, ${W.input.width} × ${W.input.depth} ft, grid ${W.input.grid} ft, proscenium height ${W.input.ph} ft, ${h(W.input.rigType)} rigging, every system on, tier ${h(tierLabel(W.input.tier))}. The “Program” column is worked out by this program right now; “Reference” is the figure from the original app.</p>
    <p id="weStatus">${W.ok ? pill("Every figure matches the reference", "grn") : pill("Some figures differ — your Settings are not the defaults", "amb")}</p>
    <table id="weTable"><tr><th>Item</th><th>System</th><th class="num">Reference</th><th class="num">Program</th><th></th></tr>${W.stats.map(s => `<tr><td>${h(s[0])}</td><td class="mut">—</td><td class="num">${s[1]}</td><td class="num">${s[2]}</td><td>${s[1] === s[2] ? "✓" : "≠"}</td></tr>`).join("")}${W.rows.map(r => `<tr><td>${h(r.label)}</td><td class="mut">${h(r.system)}</td><td class="num">${r.expected == null ? "—" : nf(r.expected) + " " + UNIT_LABEL[r.unit]}</td><td class="num">${r.mine == null ? "—" : nf(r.mine) + " " + UNIT_LABEL[r.unit]}</td><td>${r.expected === r.mine && r.drapeOk ? "✓" : "≠"}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Not in this program</h2><p>These parts of the original Design tab were left out on purpose:</p><ul><li>Uploading a plan (PDF or picture) and setting its scale — the plan here is always the built-in venue drawing.</li><li>Drawing rooms by hand, reshaping the room, and moving the booth and other movable rooms.</li><li>Wire routing between devices, risers and conduit fill.</li><li>The multi-sheet drawing set (cover sheet, one plan per system, riser and schedule sheets) — this program prints one plan sheet and one schedule.</li><li>Revisions and options (Good / Better / Best as separate layouts).</li><li>The Specs module and Consulting.</li><li>Turning a design into a quote.</li><li>Product drawings as symbols — markers here are simple shapes coloured by layer.</li><li>Assemblies, racks and the shared catalog — Parts here is your own short list.</li><li>The Church “Contemporary” drawing — a Church uses the Traditional one.</li></ul></div>`;
}

/* ---------- Backup ---------- */
function vBackup() {
  return `<h1>Backup</h1><p class="sub">Your data lives in this browser on this computer. A backup file holds everything (designs and their plans, parts, the Equipment map and settings) and can be loaded on any computer.</p>
  <div class="card"><h2>Export</h2><p>Last backup file: <b>${S.lastExportAt ? fmtLong(S.lastExportAt) : "never"}</b></p><button class="p" id="exportBackup" ${act(exportBackup)}>Download backup file</button></div>
  <div class="card"><h2>Restore</h2><p>Loading a backup <b>replaces</b> everything currently in this browser.</p><input type="file" accept="application/json,.json" id="imp"> <button ${act(importBackup)}>Load backup</button></div>
  <div class="card"><h2>Sample data</h2><p>The Equipment map starts empty, so a new design reads “Incomplete” until you map your own parts. To see the program working first, you can load a set of <b>made-up placeholder parts</b> (SKUs starting <code>SAMPLE-</code>, round prices that mean nothing) and a map that uses them. Replace them with real parts before you rely on any number.</p>
    <div class="bar"><button id="loadSample" ${act(() => { if ((S.parts.length || Object.keys(S.map).length) && !confirm("Add the SAMPLE- placeholder parts and overwrite the Equipment map with the sample map?")) return; sample(); save(); UI.msg = "Sample parts and map loaded."; render(); })}>Load sample map + parts</button>
    <button id="sampleDesign" ${act(() => { const d = blankDraft(); d.venue = "school"; d.size = "medium"; applyPreset(d, true); d.name = "Sample auditorium"; d.customer = "Sample customer"; d.rigType = "counterweight"; const n = newDesign(d); save(); go("design/" + n.id); })}>Add a sample design</button><span class="mut">${h(UI.msg)}</span></div></div>
  <div class="card"><h2>Other</h2><div class="bar"><button class="d" ${act(() => { if (confirm("Erase everything in this browser? Export a backup first.") && confirm("Really erase all data?")) { S = blankState(); UI.hist = {}; save(); go("home"); render(); } })}>Erase all data</button></div>
  <p class="mut">${plural(S.designs.length, "design")} · ${plural(S.parts.length, "part")} · ${mapStats()} of ${VOCAB.length} equipment items priced</p></div>`;
}
function exportBackup() { S.lastExportAt = Date.now(); download("peak-design-backup-" + todayIso() + ".json", JSON.stringify({ app: "peak-design", exportedAt: Date.now(), state: S }), "application/json"); save(); render(); }
function importBackup() { const f = document.getElementById("imp").files[0]; if (!f) return alert("Choose a backup file first."); const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (d.app !== "peak-design" || !d.state) throw new Error("not a Peak Design backup"); if (!confirm("Replace everything in this browser with this backup from " + fmtLong(d.exportedAt) + "?")) return; S = normalizeState(d.state); UI.hist = {}; save(); go("home"); render(); } catch (e) { alert("Could not load that file: " + e.message); } }; r.readAsText(f); }
/** Sample placeholder parts and a map that uses them. Invented, obviously round prices; never loaded automatically. */
function sample() {
  const C = { electricHoist: 5000, lowCapHoist: 3000, highCapHoist: 8000, varSpeedHoist: 12000, riggingPoint: 150, headblock: 800, footblock: 300, arbor: 1000, tbarTrack: 500, lockRail: 400, handline: 2, loftblock: 250, pipe: 10, aircraftCable: 1, chainWrap: 50, terminationKit: 25, scenerytrack: 40,
    front: 1000, cyc: 900, side: 700, automated: 4000, cablePackage: 100, console: 10000, consoleTouch: 1500, batteryBackup: 1000, button: 300, archTouch: 2500, inputStation: 800, distro: 2000, lineArray: 3000, subwoofer: 2500, mixerDsp: 20000, projector: 15000, tower: 5000, ceiling: 8000, transport: 2000, legged: 40, clearspan: 60 };
  const put = (sku, o) => { let p = S.parts.find(x => x.sku === sku); if (!p) p = newPart({ sku }); Object.assign(p, { manufacturer: "Sample Co.", markup: null }, o); return p.id; };
  const fab = {}; [["good", 2], ["better", 3], ["best", 4]].forEach(t => fab[t[0]] = put("SAMPLE-FABRIC-" + t[0].toUpperCase(), { model: "Placeholder velour (" + t[0] + ")", description: "Sample placeholder fabric — replace with a real part", deviceType: "drapery", scope: "Curtains", unit: "sqft", cost: t[1] }));
  const par = {}; [["good", 500], ["better", 800], ["best", 1200]].forEach(t => par[t[0]] = put("SAMPLE-PAR-" + t[0].toUpperCase(), { model: "Placeholder LED par (" + t[0] + ")", description: "Sample placeholder — replace with a real part", deviceType: "fixtures", scope: "Lighting", unit: "ea", cost: t[1] }));
  const wire = put("SAMPLE-WIRE", { model: "Placeholder cable", description: "Sample placeholder — replace with a real part", deviceType: "cable-connectors", scope: "", unit: "ft", cost: 1 });
  VOCAB.forEach(r => {
    const cell = id => ({ k: "part", partId: id });
    if (r.curtain) S.map[r.key] = { same: false, good: cell(fab.good), better: cell(fab.better), best: cell(fab.best) };
    else if (r.key === "lighting:par") S.map[r.key] = { same: false, good: cell(par.good), better: cell(par.better), best: cell(par.best) };
    else if (r.itemKey === "wirePull") S.map[r.key] = { same: true, good: cell(wire), better: { k: "" }, best: { k: "" } };
    else if (r.key === "video:screen") S.map[r.key] = { same: true, good: { k: "allow", amount: 10000, desc: "Projection screen allowance (sample)", ok: true }, better: { k: "" }, best: { k: "" } };
    else { const cost = r.key === "controls:processor" ? 4000 : r.key === "video:processor" ? 6000 : C[r.itemKey] || 100;
      const id = put("SAMPLE-" + (r.itemKey === "processor" ? r.system.toUpperCase() + "-" : "") + r.itemKey.replace(/([A-Z])/g, "-$1").toUpperCase(), { model: "Placeholder " + r.label.toLowerCase(), description: "Sample placeholder — replace with a real part", deviceType: VOCAB_TYPE[r.key] || "", scope: SYS[r.system].gridScope || "", unit: r.unit === "lot" ? "lot" : r.unit, cost });
      S.map[r.key] = r.key === "controls:batteryBackup" ? { same: false, good: { k: "none" }, better: cell(id), best: cell(id) } : { same: true, good: cell(id), better: { k: "" }, best: { k: "" } }; }
  });
}

/* =====================================================================
 * 8. PRINTED DOCUMENTS (use the browser's Print → Save as PDF)
 * ===================================================================== */
function docBar(back, hint) { return `<div class="bar noprint"><a class="btn" href="#/${back}">← Back</a><button class="p" onclick="window.print()">Print / Save as PDF</button><span class="mut">${hint || 'In the print dialog choose "Save as PDF" to make a file you can email.'}</span></div>`; }
function letterhead(title, right) { const C = S.company; return `<div class="lh"><div><b style="font-size:17px">${h(C.name)}</b><br><span class="mut">${h([C.address, C.phone].filter(Boolean).join(" · "))}</span></div><div style="text-align:right"><b>${h(title)}</b><br><span class="mut">${right}</span></div></div>`; }
function vDoc(p) { const d = design(p[1]); if (!d) return "<p>Not found.</p>"; return p[0] === "plan" ? docPlan(d) : docSched(d); }
const NICE_SCALES = [1, 2, 4, 5, 8, 10, 12, 16, 20, 24, 30, 32, 40, 48, 50, 60, 64, 80, 96, 100, 120, 160, 200, 240, 320, 400];
/** The largest "nice" scale (feet per printed inch) at which the plan fits the sheet's drawing area. */
function sheetScale(G, sz) { const a = DATA.sheetSizes.drawingAreaIn[sz.key], need = Math.max(G.view.w / a.w, G.view.h / a.h); return NICE_SCALES.find(s => s >= need) || Math.ceil(need / 100) * 100; }
function legendOf(d) {
  const m = {}; d.placements.forEach(p => { if ((d.hidden || {})[scopeOf(p)]) return; const sc = scopeOf(p), t = DT[typeKeyOf(p)], k = p.cur ? "cur" : sc + "|" + (t ? t.key : ""); const e = m[k] = m[k] || { scope: sc, cur: !!p.cur, code: p.cur ? "" : codeOf(p), label: p.cur ? "Curtain (drawn to width)" : t ? t.label : "Device", n: 0 }; e.n += unitsOf(p); });
  return Object.values(m).sort((a, b) => LAYERS.findIndex(l => l.key === a.scope) - LAYERS.findIndex(l => l.key === b.scope) || a.label.localeCompare(b.label));
}
function docPlan(d) {
  const G = geom(d), sz = DATA.sheetSizes.sizes[S.settings.sheet] || DATA.sheetSizes.sizes.b, sc = sheetScale(G, sz), V = G.view, q = G.q, C = S.company, lg = legendOf(d);
  /* The sheet is laid out at 11x17 and scaled by k for 24x36, so one printed inch = sc feet on either size. */
  const wIn = V.w / sc / sz.k, hIn = V.h / sc / sz.k, hiddenL = LAYERS.filter(L => (d.hidden || {})[L.key]).map(L => L.key === "Unscoped" ? "General" : L.key);
  return docBar("design/" + d.id, `Prints landscape on ${h(sz.label)} at 1″ = ${sc}′. In the print dialog choose that paper size, margins “None” and scale 100 %.`) + `<div class="sheetwrap"><div class="sheet" id="sheet" style="--sz:${sz.screenZoom * sz.k};--pz:${sz.k}">
    <div class="sdraw"><svg viewBox="${V.x} ${V.y} ${V.w} ${V.h}" style="width:${wIn}in;height:${hIn}in" xmlns="http://www.w3.org/2000/svg">${planSvg(d, G, { labels: true })}</svg></div>
    <div class="stitle">
      <div><b style="font-size:12pt">${h(C.name)}</b>${C.address ? `<br>${h(C.address)}` : ""}${C.phone ? `<br>${h(C.phone)}` : ""}</div>
      <div><small>Project</small><b>${h(d.id)}</b> · ${h(d.name)}</div><div><small>Customer</small>${h(d.customer || "—")}</div>
      <div><small>Venue</small>${h(VK[d.venue].label)} · ${nf(q.width)}′ × ${nf(q.depth)}′, ${nf(q.grid)}′ ${VK[d.venue].fields.some(f => f.key === "grid" && /Grid/.test(f.label)) ? "grid" : "ceiling"}</div>
      <div style="flex:1;overflow:hidden"><small>Legend</small><table>${lg.map(e => `<tr><td style="width:.28in"><svg viewBox="-2 -2 4 4" style="width:.22in;height:.22in">${e.cur ? `<line x1="-1.8" x2="1.8" y1="0" y2="0" stroke="${LAYER.Curtains.color}" stroke-width="0.75" stroke-linecap="round"/>` : shapeSvg(e.scope, 1.3, (LAYER[e.scope] || LAYER.Unscoped).color)}</svg></td><td><b>${h(e.code)}</b></td><td>${h(e.label)}</td><td style="text-align:right">${nf(e.n)}</td></tr>`).join("") || `<tr><td>No devices placed.</td></tr>`}</table>
        <div style="font-size:7pt;margin-top:.06in">A dashed ring marks one symbol standing for a quantity; its label gives the range. ${hiddenL.length ? "Hidden layers not shown: " + h(hiddenL.join(", ")) + "." : ""}</div>
        ${d.notes ? `<small style="margin-top:.08in">Notes</small><div style="font-size:7.5pt;white-space:pre-wrap">${h(String(d.notes).slice(0, DATA.sheetSizes.generalNotesMaxChars))}</div>` : ""}</div>
      <div><small>Status</small>— Preliminary</div><div style="display:flex;gap:.1in"><span style="flex:1"><small>Drawn by</small>${h(C.drawnBy || "—")}</span><span style="flex:1"><small>Date</small>${h(todayIso())}</span></div>
      <div><small>Scale</small><span id="scaleNote">1″ = ${sc}′-0″</span> on ${h(sz.label)}</div>
      <div><small>Sheet</small><b style="font-size:16pt">G-101</b><br>Equipment plan · 1 of 2</div>
    </div></div></div>`;
}
function docSched(d) {
  const G = geom(d), b = bom(d), est = estimate(d), list = readingOrder(d, G), q = G.q;
  return docBar("design/" + d.id) + `<div class="doc">${letterhead("Device schedule & BOM", h(d.id) + " · " + fmtLong(Date.now()) + "<br>Sheet E-601 · 2 of 2")}
    <h1>${h(d.name)}</h1><p>${d.customer ? h(d.customer) + " · " : ""}${h(VK[d.venue].label)}, ${nf(q.width)}′ × ${nf(q.depth)}′, ${nf(q.grid)}′ high · ${h(tierLabel(d.tier))} tier</p>
    <h2>Device schedule</h2>${list.length ? `<table><tr><th>Designator</th><th>Device</th><th>Type</th><th>System</th><th>Location</th><th class="num">Qty</th></tr>${list.map(p => { const a = areaAt(G, p.x, p.y), t = DT[typeKeyOf(p)], sc = scopeOf(p), px = ppx(d, p); return `<tr><td style="white-space:nowrap"><b>${h(p.cur ? "—" : desText(p))}</b></td><td>${h(nameOf(p))}${px.sku && px.status === "part" ? `<br><span class="mut">${h(px.sku)}</span>` : ""}${p.cur ? `<br><span class="mut">${h(p.cur.type)} · ${nf(p.cur.w)}′ × ${nf(p.cur.h)}′ · ${p.cur.f}% fullness</span>` : ""}</td><td>${h(p.cur ? "Curtain" : t ? t.label : "—")}</td><td>${h(sc === "Unscoped" ? "General" : sc)}</td><td>${h(a ? a.label : "—")}</td><td class="num">${nf(unitsOf(p))}</td></tr>`; }).join("")}</table>` : `<p>No devices are placed on the plan.</p>`}
    <h2 class="pb">Bill of materials — what is on the plan</h2>${b.heads.length ? b.heads.map(H => `<h3>${h(H.label)}</h3><table><tr><th>SKU</th><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th></tr>${H.lines.map(l => `<tr><td>${h(l.sku || "—")}</td><td>${h(l.name)}</td><td class="num" style="white-space:nowrap">${nf(l.qty)} ${UNIT_LABEL[l.unit] || "ea"}</td><td class="num">${l.px.status === "needs" ? "—" : $c(l.px.sell)}</td><td class="num">${l.px.status === "needs" ? "needs a part" : $(l.total)}</td></tr>`).join("")}<tr><td></td><td>Labor</td><td></td><td></td><td class="num">${$(H.labor)}</td></tr><tr><td></td><td><b>${h(H.label)} total</b></td><td></td><td></td><td class="num"><b>${$(H.material + H.labor)}</b></td></tr></table>`).join("") : `<p>Nothing is placed on the plan.</p>`}
    ${b.heads.length ? (b.need.length ? `<p style="font-size:15px"><b>${h(incompleteText(b.need.length))}.</b> No total is given until every line has a price.</p>` : `<div class="pl t"><span>BOM total</span><span>${$(b.total)}</span></div>`) : ""}
    <h2>Estimate from the equations — ${h(tierLabel(d.tier))}</h2><table><tr><th>System</th><th class="num">Equipment</th><th class="num">Labor</th></tr>${SYSTEMS.filter(s => d.sys[s.key] && est.bySys[s.key]).map(s => `<tr><td>${h(s.quickDesignLabel)}</td><td class="num">${$(est.bySys[s.key].material)}</td><td class="num">${$(est.bySys[s.key].labor)}</td></tr>`).join("")}</table>
    ${est.need.length ? `<p><b>${h(incompleteText(est.need.length))}:</b> ${est.need.map(l => h(l.row.label)).join(", ")}.</p>` : `<div class="pl"><span>Equipment ${$(est.material)} · labor ${$(est.install)} · freight ${$(est.freight)} · contingency ${$(est.contingency)}</span><b>${$(est.grand)}</b></div>`}
    <p class="mut" style="margin-top:18px">Preliminary. Quantities come from Peak's estimate equations and from the devices drawn on the plan; prices come from the Equipment map.</p></div>`;
}

/* ===================================================================== */
(async function boot() { S = normalizeState(await loadState()); chip(S.savedAt ? "Saved in this browser" : "Ready"); render(); })();

</script>
