<title>Peak Service — Flame Tests, Inspections, Venue Assessments & Assessments</title>
<!--
  Peak Service — a single-file, offline program for Flame Tests and Rigging Inspections.
  Spun out of the Quartzite app (jchesebro1-prog/peak-app) on 2026-11-19.
  No server, no login, no network. Data lives in this browser (IndexedDB) plus backup files
  you export from the Backup tab. Spec: docs/handoff/flame-inspections-spec.md.

  Ported from (repo-relative):
    pricing ....... src/lib/flametest-engine.ts, src/lib/inspection-engine.ts,
                    src/lib/service-pricing.ts, src/lib/travel-plan.ts, src/lib/repair-engine.ts (tripTravel)
    rate defaults . src/lib/stores/pricing.ts
    records ....... src/lib/stores/flame-jobs.ts, src/lib/stores/inspections.ts
    wording ....... src/lib/templates.ts
    assessments ... src/lib/assessments/defs/* (scopes S0–S8, sections, questions, pick lists and gate rules,
                    embedded whole as AS_DEF, definition version 1), src/lib/assessments/evaluate.ts (asEvaluate),
                    answers.ts (answer shape), codes.ts (short codes), findings-model.ts (Immediate rules, status
                    moves, merge, split), register.ts (register order, columns, CSV), report-model.ts (both reports),
                    editor-model.ts (suggestions, "On file" venue facts), src/lib/stores/assessments.ts (Mark
                    complete, venue-profile write), findings.ts (printed-ID numbering), venue-profiles.ts
    Assessments spec: docs/superpowers/specs/2026-10-13-assessments-engine-design.md and
                    docs/handoff/venue-assessments-spec.md chapter 19.
    Assessments, NOT in this program: offline sync and conflict handling between devices, Blob photo storage
                    (photos are shrunk and kept inside the data, like every other photo here), the estimate /
                    repair-quote hand-off ("Quote these findings" — a finding only holds typed quote references),
                    emailing reports, ⌘K search, admin-added pick-list values, assessment-date reminders.
-->

function vRules() {
  const F_ = S.rates.flame, I = S.rates.inspection, T = S.rates.travel;
  const ex = computeFlame({ venues: [{ label: "Main stage", curtains: 12, oneWayMiles: 40, oneWayMin: 50 }] }, F_, T), ex2 = computeInspection({ venues: [{ label: "Main stage", lineSets: 24, oneWayMiles: 40, oneWayMin: 50 }], level: 1 }, I, T);
  return `<h1>How pricing works</h1><p class="sub">These are the rules this program applies, with today's rates filled in. Change the numbers on the Rates tab.</p>
  <div class="card"><h2>Flame-test quote</h2><ol>
    <li><b>Testing</b>: curtains × ${F_.curtainMinutes} minutes at ${$(F_.laborRate)} per hour, per venue. A typed testing cost replaces the computed one for that venue.</li>
    <li><b>Travel</b>: charged once per quote. Round trip to the farthest venue: miles × ${$c(F_.mileageRate)}, plus drive minutes rounded up to the next ${F_.travelRoundMin} at ${$(F_.laborRate)} per hour.</li>
    <li><b>Base minimum</b>: cost = the larger of ${$(F_.baseFee)} and (travel + testing). It is a floor on the whole job, not a per-venue charge.</li>
    <li><b>Lift rental</b>: count × rate, added to cost after the base minimum.</li>
    <li><b>Markup</b>: total = cost × (1 + ${pct(F_.margin)}%).</li>
    <li><b>Rounding</b>: to the nearest $25 (half rounds up). If the base minimum set the cost, round up to the next $25.</li>
    <li><b>Typed total</b>: replaces the automatic total exactly ($1 to $10,000,000, whole dollars). It warns, never blocks, when under cost or under an ${Math.round(LOW_MARKUP_WARN * 100)}% markup.</li></ol>
    <div class="note blu"><b>Worked example</b>: 12 curtains, 40 miles and 50 minutes one way. Testing ${$c(ex.testingSubtotal)}; travel ${ex.trip.miles} mi = ${$c(ex.trip.mileageCost)} plus ${ex.trip.minutesRaw} min billed as ${ex.trip.minutes} = ${$c(ex.trip.timeCost)}; cost ${$c(ex.cost)}; marked up ${$c(ex.totalRaw)}; quoted <b>${$(ex.total)}</b>.</div></div>
  <div class="card"><h2>Rigging inspection quote</h2><ol>
    <li><b>Inspection hours</b>: ${I.baseHours} base hours per visit + line sets × ${I.lineSetMinutes} minutes, across all venues. Level 2 multiplies the hours by ${I.level2Mult}. Hours round to one decimal.</li>
    <li><b>Labor</b>: hours × ${$(I.laborRate)}.</li><li><b>Travel</b>: same shared-trip rule as flame tests.</li>
    <li><b>Markup and minimum</b>: (labor + travel) × (1 + ${pct(I.margin)}%), but never less than the ${$(I.minFee)} minimum fee.</li>
    <li><b>Lift rental</b>: count × rate × (1 + markup), added on top of the minimum fee.</li>
    <li><b>Rounding</b>: nearest $25; up to the next $25 when the minimum fee applied. A typed total replaces it exactly.</li></ol>
    <div class="note blu"><b>Worked example</b>: Level 1, 24 line sets, 40 miles and 50 minutes one way. ${ex2.inspectHours} hours = ${$c(ex2.laborCost)}; travel ${$c(ex2.trip.total)}; cost ${$c(ex2.cost)}; marked up ${$c(ex2.totalRaw)}; quoted <b>${$(ex2.total)}</b>.</div></div>
  <div class="card"><h2>Flying instead of driving</h2><p>When one trip's drive cost reaches ${$(T.flyThreshold)} (0 means never), Auto prices travel as flights. A quote can force Drive or Fly. Flying costs, for the crew:</p><ul>
    <li>Airfare: crew × ${$(T.airfarePerPerson)} (the quote can type a different fare).</li><li>Nights: on-site hours ÷ (crew × ${T.flyHoursPerDay} hours per day), rounded up, at least 1. Trip days = nights + 1.</li>
    <li>Hotel: crew × nights × ${$(T.hotelPerNight)}. Per diem: crew × trip days × ${$(T.perDiemPerDay)}.</li><li>Rental car: one car per two people × trip days × ${$(T.carPerDay)}.</li><li>Travel-day labor: crew × ${T.flyTravelHoursEachWay} hours each way × 2 at the service's labor rate.</li></ul>
    <p>The customer letter prints this as one line, "${TRAVEL_FLY_LINE}", at its share of the total.</p></div>
  <div class="card"><h2>From quote to work to renewal</h2><ul>
    <li>Draft quotes price at today's rates. Marking a quote <b>sent</b> freezes the rates it was priced at; <b>Revise</b> reopens it as a draft at today's rates.</li>
    <li>Marking a flame-test quote <b>won</b> creates one job for the whole quote: Approved → Scheduled → Completed. Completing sets the next test due one year after the date performed.</li>
    <li>Marking an inspection quote <b>won</b> creates one record per venue: Requested → Scheduled → On-site → Completed. Level 1 is due again in 1 year, Level 2 in 5 years, counted from the inspection date. Each level has its own clock.</li>
    <li>A renewal shows "Upcoming" inside 120 days, "Due soon" inside ${RENEWAL_LEAD_DAYS} days, then "Overdue".</li>
    <li>A renewal quote copies last year's scope and travel choice (drive or fly, crew, nights) and prices it at today's rates. A typed airfare, typed total and typed lift rate do not carry over.</li>
    <li>Inspection findings are numbered in severity order: Urgent, Necessary, Basic. On the checklist, Poor becomes an Urgent finding and Fair becomes a Necessary finding. A re-inspection carries every open finding forward.</li></ul></div>${asRulesCard()}`;
}

  const facts = `<table><tr><td>Date performed</td><td>${fmtLong(j.completedAt)}</td><td>Certificate no.</td><td>${h(r.cert)}</td></tr><tr><td>Technician</td><td>${h(r.performedBy)}</td><td>Good through</td><td>${fmtMonthYear(j.dueAt)}</td></tr><tr><td>Method</td><td>${h(r.method)}</td><td>Overall</td><td>${h({ pass: "Pass", partial: "Partial", fail: "Fail" }[r.overall] || r.overall)}</td></tr></table>`;
  let body;
  if (kind === "certificate") body = `<div class="cert"><p class="mut">${h(S.company.name)}</p><h1>Certificate of Flame Resistance</h1><p>Certificate no. <b>${h(r.cert)}</b></p><h2 style="border:0">${h(j.customer)}</h2><p>${h(loc)}</p>${table}<p style="margin-top:18px">${h(W("flame_report", "certificateParagraph", vars))}</p>
      <div class="sig"><div>${h(r.performedBy)} · Technician</div><div>${fmtLong(j.completedAt)} · Date tested</div></div></div>
      <h2>About this test</h2><p><b>Passed</b> — ${h(W("flame_report", "aboutPassed", vars))}</p><p><b>IFR</b> — ${h(W("flame_report", "aboutIFR", vars))}</p><p><b>Replace</b> — ${h(W("flame_report", "aboutFailed", vars))}</p><h2>NFPA 705 in brief</h2><ul>${W("flame_report", "aboutBrief", vars).split("\n").filter(Boolean).map(x => `<li>${h(x)}</li>`).join("")}</ul>`;
  else if (kind === "summary") body = letterhead("Flame-Test Summary Letter", h(j.id)) + `<p><b>${h(j.customer)}</b><br>${h(loc)}</p><p>${h(W("flame_summary_letter", "purpose", vars))}</p><p>${h(W("flame_summary_letter", "summaryStatement", vars))}</p><div class="callout">${h(W("flame_summary_letter", "nfpaQuote", vars))}</div><h2>Job data</h2>${facts}<h2>Observed result</h2>${table}${r.notes ? `<p>${h(r.notes)}</p>` : ""}<div class="sig"><div>${h(r.performedBy)} · ${h(S.company.name)}</div><div>Date</div></div>`;
  else body = letterhead("Flame-Test Results Letter", h(j.id)) + `<p><b>${h(j.customer)}</b><br>${h(loc)}${(j.contact || {}).name ? "<br>Attn: " + h(j.contact.name) : ""}</p><p>${h(W("flame_results_letter", "intro", vars))}</p><div class="callout">${h(W("flame_results_letter", "nfpaQuote", vars))}</div>${facts}<h2>Findings</h2>${table}<p>${h(W("flame_results_letter", "resultsLine", vars))}</p><p>${h(W("flame_results_letter", "findingsNote", vars))}</p>${t.failed > 0 ? `<p><b>${h(W("flame_results_letter", "failedNote", vars))}</b></p>` : ""}${r.notes ? `<p>${h(r.notes)}</p>` : ""}<p>${h(W("flame_results_letter", "retainNote", vars))}</p><div class="sig"><div>${h(r.performedBy)} · ${h(S.company.name)}</div><div>Date</div></div>`;
  return docBar("flame/" + j.id) + `<div class="doc">${body}</div>`;
}
function docInsp(r) {
  if (!r) return "<p>Not found.</p>";
  const c = logCounts(r), W_ = f => W("inspection_report", f, { company: S.company.name }), cond = CONDITIONS.find(x => x[0] === r.condition) || CONDITIONS[1];
  const kv = (list, obj) => { const rows = list.filter(f => (obj || {})[f[0]]); return rows.length ? `<table>${rows.map(f => `<tr><td style="width:40%" class="mut">${h(f[1])}</td><td>${h(obj[f[0]])}</td></tr>`).join("")}</table>` : ""; };
  const ratedSecs = r.rubric.filter(s => s.items.some(i => i.rating));
  return docBar("insp/" + r.id) + `<div class="doc">${letterhead("Rigging Inspection Report", levelMeta(r.level).long)}
    <h1>${h(r.venue || r.customer)}</h1><p>${h(r.customer)}<br>${h(r.address)}</p>
    <table><tr><td class="mut">Inspection date</td><td>${fmtLong(r.surveyDate)}</td><td class="mut">Report date</td><td>${fmtLong(r.reportDate)}</td></tr><tr><td class="mut">Inspector</td><td>${h(r.inspector)}</td><td class="mut">Report no.</td><td>${h(r.id)}</td></tr><tr><td class="mut">Venue contact</td><td>${h(r.contact)}</td><td class="mut">Overall condition</td><td><b>${cond[1]}</b></td></tr>${r.priorSurveyDate ? `<tr><td class="mut">Previous inspection</td><td colspan="3">${fmtLong(r.priorSurveyDate)}</td></tr>` : ""}</table>
    ${r.narrative ? `<h2>Summary</h2>${paras(r.narrative)}` : ""}${r.scope ? `<h2>Scope</h2>${paras(r.scope)}` : ""}
    <h2>Findings at a glance</h2><table><tr><th>Category</th><th class="num">Open</th><th class="num">Closed</th></tr>${SEVERITIES.map(s => `<tr><td><b>${s.long}</b><br><span class="mut">${h(s.blurb)}</span></td><td class="num">${c[s.key].open}</td><td class="num">${c[s.key].closed}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="num"><b>${c.open}</b></td><td class="num"><b>${c.closed}</b></td></tr></table>
    <h2>About this inspection</h2><p>${h(W_("inspectionPurpose"))}</p><p>${h(W_("howToUse"))}</p><p>${h(W_("standardsIntro"))}</p><ul>${STANDARDS_LIST.map(s => `<li><b>${s[0]}</b> — ${h(s[1])}</li>`).join("")}</ul>
    ${kv(VENUE_FACTS, r.venueInfo) || kv(SYSTEM_FIELDS, r.venueInfo) ? `<h2 class="pb">About your venue</h2>${kv(VENUE_FACTS, r.venueInfo)}${kv(SYSTEM_FIELDS, r.venueInfo)}` : ""}
    ${MEASUREMENT_GROUPS.some(g => g.items.some(f => (r.measurements || {})[f[0]])) ? `<h2>Stage measurements</h2>${MEASUREMENT_GROUPS.map(g => { const t = kv(g.items, r.measurements); return t ? `<h3>${g.group}</h3>${t}` : ""; }).join("")}` : ""}
    <h2 class="pb">Rigging logs</h2>${r.logs.length ? r.logs.map(l => { const s = sevMeta(l.severity); return `<div class="log ${l.severity}"><p style="margin:0"><b>Log ${l.id} · ${h(l.problem)}</b> ${pill(s.long, s.cls)} ${pill(l.status === "closed" ? "Closed" : "Open", l.status === "closed" ? "grn" : "red")}</p>
      <p class="mut" style="margin:2px 0 8px">${h(l.location)}${l.firstNoted ? " · first noted " + fmtLong(l.firstNoted) : ""}${(l.standards || []).length ? " · " + h(l.standards.join(", ")) : ""}</p>
      ${l.explanation ? `<p><b>Explanation.</b> ${h(l.explanation)}</p>` : ""}${l.solution ? `<p><b>Solution.</b> ${h(l.solution)}</p>` : ""}${l.status === "closed" && l.workPerformed ? `<p><b>Work performed.</b> ${h(l.workPerformed)}</p>` : ""}
      <div class="row">${l.beforePhoto ? `<img class="ph" src="${l.beforePhoto}" alt="Before">` : ""}${l.afterPhoto ? `<img class="ph" src="${l.afterPhoto}" alt="After">` : ""}</div></div>`; }).join("") : `<p>No deficiencies were recorded.</p>`}
    ${ratedSecs.length ? `<h2 class="pb">Component condition checklist</h2>${ratedSecs.map(s => `<h3>${s.n}. ${h(s.title)}${s.lineSet ? " · line set " + h(s.lineSet) : ""}</h3><table>${s.items.map(i => `<tr><td style="width:24px">${i.l}</td><td>${h(i.label)}</td><td style="width:70px"><b>${h((RUBRIC_RATINGS.find(x => x[0] === i.rating) || ["", "—"])[1])}</b></td></tr>`).join("")}</table>${s.comments ? `<p class="mut">${h(s.comments)}</p>` : ""}${s.photo ? `<img class="ph" src="${s.photo}" alt="">` : ""}`).join("")}` : ""}
    <h2>About ${h(S.company.name)}</h2><p>${h(W_("about"))}</p><p>${h(W_("mission"))}</p><h2>Disclaimer</h2><p>${h(W_("disclaimer"))}</p></div>`;
}

/* ===================================================================== */
(async function boot() { S = normalizeState(await loadState()); chip(S.savedAt ? "Saved in this browser" : "Ready"); render(); })();
</script>
