<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e0f12" />
    <title>Offline — Quartzite</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #16181d; font: 15px/1.5 system-ui, sans-serif; }
      main { width: min(440px, 100%); background: #fff; border: 1px solid #e4e7ec; border-radius: 16px; padding: 28px; box-shadow: 0 14px 40px rgba(20,24,32,.09); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #686e79; }
      div { display: flex; gap: 10px; flex-wrap: wrap; }
      button { min-height: 42px; border-radius: 9px; padding: 9px 16px; border: 1px solid #dfe2e8; background: #fff; color: #343944; font: inherit; font-weight: 650; cursor: pointer; }
      button:first-child { border-color: #b08d4a; background: #b08d4a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>This page isn’t on this device yet</h1>
      <p>Pages and jobs you opened while connected remain available offline. Go back to keep working there, or retry when you have a connection.</p>
      <div>
        <button type="button" onclick="history.back()">Go back</button>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
